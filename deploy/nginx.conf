# Localization OS TMS - nginx reverse proxy sample (Phase 4-C).
#
# Alternative to deploy/Caddyfile for shops that already run nginx. Unlike Caddy,
# nginx does NOT obtain TLS certificates for you - point ssl_certificate at certs
# you manage (e.g. certbot / your CA). The Caddyfile is the lower-effort option
# for auto-HTTPS; this file is here for parity.
#
# TOPOLOGY NOTE: ONLY this proxy should face the public internet. It forwards to
# the app at app:8000 (the compose service name) - or 127.0.0.1:8000 if you run
# nginx on the host against the localhost-published port. The web UI is
# session/RBAC-authed; the /api surface is token-authed (X-Loc-Token). Never
# expose the Postgres service.

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tms.example.com;          # <-- replace with your domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tms.example.com;          # <-- replace with your domain

    # ---- TLS: point these at your own certificate + key ----
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Match the app's MAX_UPLOAD_BYTES (default 100 MB) so uploads aren't cut off.
    client_max_body_size 100m;

    # Security headers (transport-level).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    location / {
        # `app` is the compose service; use 127.0.0.1:8000 if nginx runs on the
        # host against the published port instead.
        proxy_pass http://app:8000;

        # Preserve Host end-to-end - the app's same-origin CSRF check compares
        # Origin/Referer against Host, so a rewritten Host would false-positive.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The edge owns HSTS (#614): drop the app's baseline header so browsers see only
        # the add_header value above (they honour only the FIRST Strict-Transport-Security).
        proxy_hide_header Strict-Transport-Security;

        # Server-Sent Events (live translate / job progress) need buffering off
        # and a long read timeout so the stream isn't cut.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
