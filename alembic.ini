# Alembic config for Localization OS TMS.
#
# The database URL is NOT set here - env.py resolves it from app.config.DB_URL,
# which is the single source of truth (respects DATABASE_URL + LOC_TMS_DATA_DIR).
# SQLite stays the zero-config default; set DATABASE_URL to target Postgres, e.g.
#   set DATABASE_URL=postgresql+psycopg://user:pass@host:5432/loc_tms
#   alembic upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
# Timezone-naive UTC timestamps in generated revision files.
# (leave sqlalchemy.url unset - env.py provides it)

# We deliberately do NOT configure Python logging here. The app owns logging
# (module getLogger("loc_tms.*") + uvicorn's config); alembic's default
# loggers would clobber it. env.py leaves logging untouched, so no
# [loggers]/[handlers]/[formatters] sections appear below.
